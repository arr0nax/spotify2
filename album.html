<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album - Spotify2</title>
    <link rel="canonical" id="albumCanonical">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 0;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 2rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #b3b3b3;
            letter-spacing: 1px;
            padding: 0 1.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 1.5rem;
            color: #b3b3b3;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            cursor: pointer;
        }

        .sidebar-cover {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #1db954, #1ed760);
        }

        .sidebar-album-title {
            min-width: 0;
        }

        .cover-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-fallback {
            font-size: 1.4rem;
            line-height: 1;
        }

        .sidebar-link:hover {
            color: #fff;
            background: rgba(29, 185, 84, 0.1);
            border-left-color: #1db954;
        }

        .sidebar-link.active {
            color: #1db954;
            background: rgba(29, 185, 84, 0.1);
            border-left-color: #1db954;
        }

        /* Content wrapper */
        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        /* Header/Navigation Bar */
        header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 0.7rem 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: #b3b3b3;
        }

        .search-bar:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #1db954;
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.3);
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(29, 185, 84, 0.3);
            border-radius: 8px;
            margin-top: 0.5rem;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
        }

        .search-dropdown.active {
            display: block;
        }

        .suggestion-item {
            padding: 0.8rem 1rem;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(29, 185, 84, 0.2);
            padding-left: 1.2rem;
        }

        .suggestion-icon {
            font-size: 1.2rem;
        }

        .suggestion-text {
            flex: 1;
        }

        .suggestion-title {
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .suggestion-subtitle {
            font-size: 0.8rem;
            color: #b3b3b3;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1db954, #1ed760);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn-login {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
        }

        .btn-login:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        .btn-signup {
            background: linear-gradient(135deg, #1db954, #1ed760);
            color: #000;
        }

        .btn-signup:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(29, 185, 84, 0.4);
        }

        /* Album Hero Section */
        .album-hero {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 3rem;
            align-items: flex-end;
            width: 100%;
        }

        /* Player Controls */
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            z-index: 200;
        }

        .player-content {
            max-width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            gap: 2rem;
            align-items: center;
        }

        .player-song-info {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .player-album-art {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        #player-album-art {
            height: 50px;
            width: 50px;
        }

        .player-song-details h4 {
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
            font-weight: 600;
        }

        .player-song-details p {
            font-size: 0.8rem;
            color: #b3b3b3;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .controls-buttons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            align-items: center;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            padding: 0.5rem;
        }

        .control-btn:hover {
            color: #1db954;
            transform: scale(1.1);
        }

        .play-pause-btn {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            color: #000;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
        }

        .play-pause-btn:hover {
            color: #000;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1db954, #1ed760);
            border-radius: 2px;
            width: 0%;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #b3b3b3;
            margin-top: 0.3rem;
        }

        .player-right {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            align-items: center;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
        }

        .album-cover {
            width: 250px;
            height: 250px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        #album-cover {
            max-width: 100%;
            /* max-height: 100%; */
        }

        .album-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .album-type {
            font-size: 0.9rem;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .album-title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            line-height: 1.1;
        }

        .album-artist {
            font-size: 1.1rem;
            color: #b3b3b3;
            margin-bottom: 1rem;
        }

        .album-meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            color: #b3b3b3;
            font-size: 0.9rem;
        }

        .meta-value {
            font-size: 1rem;
            font-weight: 700;
        }

        .album-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-play {
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #1db954, #1ed760);
            color: #000;
            border: none;
            border-radius: 24px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(29, 185, 84, 0.5);
        }

        .btn-like {
            padding: 1rem 1.5rem;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 24px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-like:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        /* Songs List */
        .songs-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .songs-header {
            display: grid;
            grid-template-columns: 50px 1fr 200px 100px 50px;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #b3b3b3;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        .song-item {
            display: grid;
            grid-template-columns: 50px 1fr 200px 100px 50px;
            gap: 1rem;
            padding: 1rem;
            border-radius: 8px;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .song-number {
            text-align: center;
            color: #b3b3b3;
            font-weight: 600;
        }

        .song-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .song-title {
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 1rem;
        }

        .song-artist {
            color: #b3b3b3;
            font-size: 0.9rem;
        }

        .song-album {
            color: #b3b3b3;
            font-size: 0.9rem;
        }

        .song-duration {
            text-align: right;
            color: #b3b3b3;
            font-size: 0.9rem;
        }

        .song-play-btn {
            background: linear-gradient(135deg, #1db954, #1ed760);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-weight: bold;
            opacity: 0;
            text-decoration: none;
        }

        .song-item:hover .song-play-btn {
            opacity: 1;
        }

        .song-item:hover .song-number {
            opacity: 0;
        }

        /* Footer */
        footer {
            background: rgba(0, 0, 0, 0.6);
            padding: 2rem;
            text-align: center;
            color: #b3b3b3;
            margin-top: 4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        [hidden] { display: none !important; }
        button:disabled, input:disabled { opacity: 0.45; cursor: not-allowed; }
        :focus-visible { outline: 2px solid #1ed760; outline-offset: 4px; }
        .album-cover img, .player-album-art img { width: 100%; height: 100%; object-fit: cover; }
        .player-album-art { overflow: hidden; }
        .album-description { color: #b3b3b3; margin-bottom: 1.5rem; line-height: 1.5; }
        .song-item:focus-within .song-play-btn { opacity: 1; }
        .song-item[aria-disabled="true"] { cursor: default; }
        .song-item[aria-current="true"] { background: rgba(29, 185, 84, 0.15); }
        .song-item[aria-disabled="true"] .song-play-btn { opacity: 0.45; }
        #playerStatus { font-size: 0.8rem; color: #b3b3b3; }
        #albumNotFound { padding: 3rem 2rem; }
        #albumNotFound a { color: #1ed760; }

        @media (max-width: 1024px) {
            .sidebar {
                width: 200px;
            }

            .search-container {
                max-width: 250px;
            }
        }

        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding: 1rem 0;
                display: flex;
                overflow-x: auto;
                overflow-y: hidden;
                height: auto;
                display: none;
            }

            .sidebar-section {
                display: flex;
                gap: 2rem;
                margin-bottom: 0;
            }

            .sidebar-title {
                display: none;
            }

            .album-hero {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .album-cover {
                width: 100%;
                height: 200px;
                margin: 0 auto;
            }

            .album-title {
                font-size: 2rem;
            }

            .songs-header,
            .song-item {
                grid-template-columns: 40px 1fr 80px;
            }

            .song-album,
            .song-duration {
                display: none;
            }

            .navbar {
                flex-direction: column;
                gap: 1rem;
            }

            .search-container {
                width: 100%;
                max-width: 100%;
            }

            .player-content {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .player-right {
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="views.css">
</head>

<body>
    <!-- Navigation Header -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo" aria-label="Spotify2 Home">♪ Spotify2</a>
            <div class="search-container">
                <input type="search" class="search-bar" id="searchInput" aria-label="Search albums, artists, and songs" placeholder="Search songs, artists, albums...">
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
            <div class="nav-buttons">
                <a target="_blank" rel="noopener noreferrer" data-album-buy hidden class="btn btn-login">Buy
                    Now</a>
                <a target="_blank" rel="noopener noreferrer" data-album-buy hidden class="btn btn-signup">Buy
                    Now</a>
            </div>
        </nav>
    </header>

    <div class="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Menu</div>
                <a href="index.html" class="sidebar-link">🏠 Home</a>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Albums</div>
                <div id="albumLibrary"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="content">
            <section id="albumNotFound" hidden>
                <h1>Album not found</h1>
                <p>This album is not available. <a href="index.html">Return Home</a>.</p>
            </section>
            <!-- Album Hero Section -->
            <section class="album-hero" id="albumHero" hidden>
                <div class="album-cover" id="album-cover"></div>
                <div class="album-info">
                    <div class="album-type">Album</div>
                    <h1 class="album-title" id="albumTitle"></h1>
                    <div class="album-artist" id="albumArtist"></div>
                    <div class="album-meta">
                        <div class="meta-item">
                            <span class="meta-label">Release Date</span>
                            <span class="meta-value" id="albumReleaseDate"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Total Tracks</span>
                            <span class="meta-value" id="albumTrackCount"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Duration</span>
                            <span class="meta-value" id="albumDuration"></span>
                        </div>
                    </div>
                    <p class="album-description" id="albumDescription" hidden></p>
                    <div class="album-actions">
                        <button type="button" class="btn-play" id="albumPlayBtn" aria-label="Play album" disabled>▶ Play</button>
                        <a target="_blank" rel="noopener noreferrer" data-album-buy hidden class="btn-like">♡
                            Buy Now</a>
                    </div>
                </div>
            </section>

            <!-- Songs List -->
            <section class="songs-container" id="albumTracks" aria-label="Album tracks" hidden>
                <div class="songs-header">
                    <div>#</div>
                    <div>Title</div>
                    <div>Album</div>
                    <div>Duration</div>
                    <div></div>
                </div>

                <div id="trackList"></div>
            </section>
        </div>
        <!-- Footer -->
        <footer>
            <p>&copy; Fuck Spotify</p>
            <a target="_blank" rel="noopener noreferrer" data-album-buy hidden>Buy This Album Here</a>
        </footer>
    </div>

    <script defer src="albums.js"></script>
    <script defer src="player.js"></script>
    <script defer src="album.js"></script>
    <script defer src="site.js?v=4"></script>

</body>

</html>
